[project]
name = "devin-mcp-cli"
version = "0.1.0"
description = "CLI wrapper for Devin MCP Server"
authors = [
    {name = "Filip Prochazka"}
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25.0,<2.0.0",
    "click>=8.3.1,<9.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pyyaml>=6.0.3,<7.0.0",
    "rich>=14.2.0,<15.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.scripts]
devin-mcp = "devin_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devin_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.14.10,<0.15.0",
]
