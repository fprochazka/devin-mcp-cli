[project]
name = "devin-mcp-cli"
version = "0.2.0"
description = "CLI for the tools of the Devin MCP server"
authors = [
    {name = "Filip Prochazka"}
]
requires-python = ">=3.12"
dependencies = [
    "mcp-to-cli-kit>=0.6.0,<0.7",
    "click>=8.3.1,<9.0.0",
]

[project.scripts]
devin-mcp = "devin_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devin_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.14.10,<0.15.0",
]
